<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Брелок Инь-Ян</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Layout: full-bleed studio box behind the phone glass; the keychain hangs from the top of the screen. Nameplate top-left, controls docked at the bottom. Single deliberate dark look. */
:root{
  --ink:#0f1012;
  --sweep-hi:#45484d;
  --sweep-lo:#141518;
  --fg:#ece9e2;
  --muted:#9a9ca1;
  --line:rgba(236,233,226,.14);
  --chip:rgba(20,21,24,.55);
  --display:"Forum", "Cormorant Garamond", Georgia, serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ink); color:var(--fg); font-family:var(--body); overflow:hidden}
#stage{
  position:fixed; inset:0;
  background:radial-gradient(120% 90% at 50% 38%, var(--sweep-hi) 0%, #2a2c30 42%, var(--sweep-lo) 100%);
  touch-action:none; cursor:grab;
}
#stage.grabbing{cursor:grabbing}
#stage canvas{display:block; width:100%; height:100%; outline:none}

.plate{
  position:fixed; top:calc(env(safe-area-inset-top,0px) + 20px); left:20px; right:20px;
  pointer-events:none; display:grid; gap:6px; max-width:22rem;
}
.eyebrow{margin:0; font:500 11px/1.2 var(--body); letter-spacing:.16em; text-transform:uppercase; color:var(--muted)}
h1{margin:0; font:400 clamp(30px,6vw,52px)/1 var(--display); letter-spacing:.01em; text-wrap:balance}
.spec{margin:10px 0 0; display:flex; flex-wrap:wrap; gap:6px 18px; font:400 12px/1.3 var(--mono); color:var(--muted)}
.spec div{display:flex; gap:6px}
.spec dt{margin:0}
.spec dd{margin:0; color:var(--fg); font-variant-numeric:tabular-nums}

.dock{
  position:fixed; left:0; right:0; bottom:0;
  padding:0 16px calc(env(safe-area-inset-bottom,0px) + 18px);
  display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:10px;
  pointer-events:none;
}
.group{
  pointer-events:auto; display:flex; gap:4px; padding:4px;
  background:var(--chip); border:1px solid var(--line); border-radius:999px;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
.dock button{
  appearance:none; border:0; background:transparent; color:var(--muted);
  font:500 13px/1 var(--body); padding:9px 14px 9px 10px; border-radius:999px;
  display:flex; align-items:center; gap:8px; cursor:pointer; transition:background .2s, color .2s;
}
.dock button:hover{color:var(--fg)}
.dock button[aria-checked="true"], .dock button[aria-pressed="true"]{background:rgba(236,233,226,.12); color:var(--fg)}
.dock button:focus-visible{outline:2px solid var(--fg); outline-offset:2px}
.sw{width:16px; height:16px; border-radius:50%; box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.sw.silver{background:radial-gradient(circle at 35% 30%, #ffffff, #b9b8b4 55%, #6d6c69)}
.sw.gold{background:radial-gradient(circle at 35% 30%, #fff1c9, #d9a548 55%, #7a5216)}
.sw.graphite{background:radial-gradient(circle at 35% 30%, #a3a5aa, #4b4d52 55%, #1c1d20)}
.ico{width:16px; height:16px; flex:none}
.ico path, .ico circle, .ico rect{fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}

.hint{
  position:fixed; right:20px; top:calc(env(safe-area-inset-top,0px) + 24px);
  margin:0; font:400 11px/1.5 var(--mono); color:var(--muted); text-align:right; pointer-events:none; max-width:15rem;
}
.toast{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 80px);
  width:min(30rem, calc(100% - 32px)); box-sizing:border-box;
  margin:0; padding:12px 14px; border-radius:14px;
  background:rgba(20,21,24,.82); border:1px solid var(--line);
  font:400 13px/1.45 var(--body); color:var(--fg); text-align:center;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
.status{
  position:fixed; inset:0; display:grid; place-items:center;
  font:400 13px/1.4 var(--mono); color:var(--muted); pointer-events:none; padding:0 24px; text-align:center;
}
@media (max-width:640px){ .hint{display:none} .spec{font-size:11px} .dock button{padding:9px 12px 9px 9px} }
@media (prefers-reduced-motion: reduce){ .dock button{transition:none} }
</style>
</head>
<body>


<div id="stage" aria-label="Трёхмерная модель брелка инь-ян. Возьмите брелок и потяните, чтобы раскачать."></div>

<header class="plate">
  <p class="eyebrow">Брелок · горячая эмаль</p>
  <h1>Инь&nbsp;и&nbsp;Ян</h1>
  <dl class="spec">
    <div><dt>Ø</dt><dd>33 мм</dd></div>
    <div><dt>вес</dt><dd>27 г</dd></div>
    <div><dt>металл</dt><dd id="metalName">Ag 925</dd></div>
  </dl>
</header>

<p class="hint">Возьмите брелок и потяните<br>Тяните по фону, чтобы повернуть вид<br>«Датчики» — качайте сам телефон</p>

<div class="dock">
  <div class="group" role="radiogroup" aria-label="Металл">
    <button type="button" id="f-silver" role="radio" aria-checked="true" data-finish="silver"><span class="sw silver"></span>Серебро</button>
    <button type="button" id="f-gold" role="radio" aria-checked="false" data-finish="gold"><span class="sw gold"></span>Золото</button>
    <button type="button" id="f-graphite" role="radio" aria-checked="false" data-finish="graphite"><span class="sw graphite"></span>Графит</button>
  </div>
  <div class="group">
    <button type="button" id="sensors" aria-pressed="false">
      <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="4.5" y="1.5" width="7" height="13" rx="1.6"/><path d="M1.5 5.5c-.8 1.6-.8 3.4 0 5M14.5 5.5c.8 1.6.8 3.4 0 5"/></svg>
      Датчики
    </button>
    <button type="button" id="shake">
      <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5v3M3 9.5a5 5 0 0 0 10 0M5.5 5.5 3 3M10.5 5.5 13 3"/></svg>
      Встряхнуть
    </button>
  </div>
</div>

<p class="toast" id="toast" role="status" hidden></p>
<p class="status" id="status">Собираю модель…</p>

<script>
/* ===== Keychain physics: XPBD rigid bodies (Müller et al. 2020), pure JS ===== */
const KeyPhysics = (() => {
  const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
  const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
  const scl=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
  const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
  const crs=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
  const len=a=>Math.hypot(a[0],a[1],a[2]);
  const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
  const qmul=(a,b)=>[
    a[3]*b[0]+a[0]*b[3]+a[1]*b[2]-a[2]*b[1],
    a[3]*b[1]-a[0]*b[2]+a[1]*b[3]+a[2]*b[0],
    a[3]*b[2]+a[0]*b[1]-a[1]*b[0]+a[2]*b[3],
    a[3]*b[3]-a[0]*b[0]-a[1]*b[1]-a[2]*b[2]];
  const qcon=q=>[-q[0],-q[1],-q[2],q[3]];
  const qnrm=q=>{const l=Math.hypot(q[0],q[1],q[2],q[3]);return [q[0]/l,q[1]/l,q[2]/l,q[3]/l];};
  const qrot=(q,v)=>{const[x,y,z,w]=q;const tx=2*(y*v[2]-z*v[1]),ty=2*(z*v[0]-x*v[2]),tz=2*(x*v[1]-y*v[0]);
    return [v[0]+w*tx+(y*tz-z*ty), v[1]+w*ty+(z*tx-x*tz), v[2]+w*tz+(x*ty-y*tx)];};

  function body({mass, inertia, x, q, pts=[], radius=0, dynamic=true}){
    return { dyn:dynamic, invM:dynamic?1/mass:0, invI:dynamic?inertia.map(i=>1/i):[0,0,0],
      x:x.slice(), q:q.slice(), v:[0,0,0], w:[0,0,0], xp:x.slice(), qp:q.slice(), pts, radius };
  }
  function invIw(b,v){ if(!b.dyn) return [0,0,0]; const l=qrot(qcon(b.q),v);
    return qrot(b.q,[l[0]*b.invI[0],l[1]*b.invI[1],l[2]*b.invI[2]]); }
  function genW(b,r,n){ if(!b.dyn) return 0; const rn=crs(r,n); return b.invM+dot(rn,invIw(b,rn)); }
  function angW(b,n){ return b.dyn ? dot(n,invIw(b,n)) : 0; }
  function rotBy(b,dw){ const d=qmul([dw[0],dw[1],dw[2],0],b.q);
    b.q=qnrm([b.q[0]+0.5*d[0],b.q[1]+0.5*d[1],b.q[2]+0.5*d[2],b.q[3]+0.5*d[3]]); }
  function corr(b,P,r){ if(!b.dyn) return; b.x=add(b.x,scl(P,b.invM)); rotBy(b,invIw(b,crs(r,P))); }
  function impulse(b,p,r){ if(!b.dyn) return; b.v=add(b.v,scl(p,b.invM)); b.w=add(b.w,invIw(b,crs(r,p))); }
  function velAt(b,r){ return add(b.v,crs(b.w,r)); }

  function world(cfg){
    const W = {
      hand: body({mass:1,inertia:[1,1,1],x:cfg.hand,q:[0,0,0,1],dynamic:false}),
      bodies: cfg.bodies.map(body),
      joints: cfg.joints,          // {a,b (index, -1=hand), ra, rb (local), axA, axB (local) | null, slop}
      substeps: cfg.substeps||40,
      jointFriction: cfg.jointFriction??2.5,   // 1/s, metal-on-metal rubbing in the links
      airDrag: cfg.airDrag??0.35,
      angDrag: cfg.angDrag??0.06,
      mu_s: 0.38, mu_d: 0.28, restitution: 0.32,
      spheres: cfg.spheres||[],     // [i,j] pairs colliding as spheres (radius per body)
    };
    const B = i => i<0 ? W.hand : W.bodies[i];

    W.step = function(dt, env){
      // env: {g:[3] effective accel in sim frame, hand:[3] target, walls:[{n,d}], grab:{i,local,target,compliance}|null}
      const n=W.substeps, h=dt/n, handFrom=W.hand.x.slice(), gN=len(env.g);
      for (let s=0;s<n;s++){
        W.hand.x = lerp(handFrom, env.hand, (s+1)/n);
        for (const b of W.bodies){
          b.v=add(b.v,scl(env.g,h)); b.xp=b.x; b.x=add(b.x,scl(b.v,h));
          b.qp=b.q; rotBy(b,scl(b.w,h));
        }
        // joints
        for (const j of W.joints){
          const a=B(j.a), b=B(j.b);
          const ra=qrot(a.q,j.ra), rb=qrot(b.q,j.rb);
          const d=sub(add(b.x,rb),add(a.x,ra)), c=len(d);
          if (c>1e-9){ const nn=scl(d,1/c), wa=genW(a,ra,nn), wb=genW(b,rb,nn), l=c/(wa+wb);
            corr(a,scl(nn,l),ra); corr(b,scl(nn,-l),rb); }
          if (j.axA){
            const A=qrot(a.q,j.axA), Bv=qrot(b.q,j.axB), cr=crs(A,Bv), sn=len(cr);
            if (sn>1e-6){
              const ang=Math.acos(Math.max(-1,Math.min(1,dot(A,Bv))));
              let err=ang-Math.PI/2;
              if (Math.abs(err)>j.slop){ err-=Math.sign(err)*j.slop;
                const nn=scl(cr,1/sn), wa=angW(a,nn), wb=angW(b,nn), l=err/(wa+wb);
                if (a.dyn) rotBy(a,invIw(a,scl(nn,l)));
                if (b.dyn) rotBy(b,invIw(b,scl(nn,-l)));
              }
            }
          }
        }
        // finger grab: soft zero-length spring
        if (env.grab){
          const g=env.grab, b=W.bodies[g.i], r=qrot(b.q,g.local);
          const d=sub(g.target,add(b.x,r)), c=len(d);
          if (c>1e-9){ const nn=scl(d,1/c), w=genW(b,r,nn), l=c/(w+g.compliance/(h*h)); corr(b,scl(nn,l),r); }
        }
        // contacts: walls (point samples) + sphere pairs
        const contacts=[];
        for (const b of W.bodies){
          for (const wl of env.walls){
            for (const p of b.pts){
              const r=qrot(b.q,p), wp=add(b.x,r), pen=wl.d-dot(wl.n,wp);
              if (pen<=0) continue;
              const vn=dot(wl.n,velAt(b,r));
              const w=genW(b,r,wl.n), l=pen/w;
              corr(b,scl(wl.n,l),r);
              // static friction: undo tangential slip of the contact point this substep
              const r2=qrot(b.q,p), cur=add(b.x,r2), prev=add(b.xp,qrot(b.qp,p));
              let dp=sub(cur,prev); dp=sub(dp,scl(wl.n,dot(dp,wl.n)));
              const dl=len(dp);
              if (dl>1e-9){ const tn=scl(dp,1/dl), wt=genW(b,r2,tn), lt=dl/wt;
                if (lt < W.mu_s*l) corr(b,scl(tn,-lt),r2); }
              contacts.push({b,p,n:wl.n,vn,l});
            }
          }
        }
        for (const [i,k] of W.spheres){
          const a=W.bodies[i], b=W.bodies[k], d=sub(b.x,a.x), c=len(d), R=a.radius+b.radius;
          if (c<R && c>1e-6){ const nn=scl(d,1/c), l=(R-c)/(a.invM+b.invM);
            corr(a,scl(nn,-l),[0,0,0]); corr(b,scl(nn,l),[0,0,0]); }
        }
        // velocities from positions
        for (const b of W.bodies){
          b.v=scl(sub(b.x,b.xp),1/h);
          const dq=qmul(b.q,qcon(b.qp)); const sg=dq[3]<0?-1:1;
          b.w=[2*dq[0]/h*sg,2*dq[1]/h*sg,2*dq[2]/h*sg];
        }
        // velocity pass: restitution + dynamic friction
        for (const c of contacts){
          const b=c.b, r=qrot(b.q,c.p), v=velAt(b,r), vn=dot(c.n,v);
          let vt=sub(v,scl(c.n,vn)); const vtl=len(vt);
          let dv=[0,0,0];
          if (vtl>1e-9) dv=scl(vt,-Math.min(W.mu_d*c.l/h, vtl)/vtl);
          const e = Math.abs(c.vn) > 2*gN*h ? W.restitution : 0;
          dv=add(dv,scl(c.n,-vn+Math.max(-e*c.vn,0)));
          const dl=len(dv); if (dl<1e-9) continue;
          const dn=scl(dv,1/dl), w=genW(b,r,dn);
          impulse(b,scl(dn,dl/w),r);
        }
        // joint friction: damp relative spin across each link
        for (const j of W.joints){
          const a=B(j.a), b=B(j.b), rel=sub(b.w,a.w), rl=len(rel);
          if (rl<1e-9) continue;
          const nn=scl(rel,1/rl), wa=angW(a,nn), wb=angW(b,nn), k=Math.min(1,W.jointFriction*h);
          const L=rl*k/(wa+wb);
          if (a.dyn) a.w=add(a.w,invIw(a,scl(nn,L)));
          if (b.dyn) b.w=sub(b.w,invIw(b,scl(nn,L)));
        }
        for (const b of W.bodies){ b.v=scl(b.v,1-W.airDrag*h); b.w=scl(b.w,1-W.angDrag*h); }
      }
    };
    return W;
  }

  /* ---- keychain layout (1 unit = 15 mm), shared by renderer and solver ---- */
  function layout(){
    const RR=0.66, RW=0.03, PITCH=2*RW+0.004, TH0=Math.PI*0.22, ZS=0.8;
    const LA=0.17, LB=0.092, LR=0.026, RJ=0.12, rj=0.026;
    const RO=1.1, T=0.1, BAIL_Y=1.18, BAIL_R=0.1, BAIL_r=0.034;
    const zAt = ang => { const t=((ang-TH0)%(2*Math.PI)+2*Math.PI)%(2*Math.PI); return (PITCH*t/(2*Math.PI)-PITCH+PITCH/2)*ZS; };
    const zMid=zAt(3*Math.PI/2), zTop=zAt(Math.PI/2);
    const ys=-2*RR, y1=ys+RW+LR-LA, y2=(y1-LA)+2*LR-LA, yj=(y2-LA)+LR+rj-RJ;
    const bailTop=(yj-RJ)+rj+BAIL_r, py=bailTop-(BAIL_Y+BAIL_R);

    const inertia=(pts,m,extra=0)=>{ let a=0,b=0,c=0; for(const p of pts){a+=p[1]*p[1]+p[2]*p[2];b+=p[0]*p[0]+p[2]*p[2];c+=p[0]*p[0]+p[1]*p[1];}
      const k=m/pts.length; return [a*k+extra*m,b*k+extra*m,c*k+extra*m]; };
    const helixPts=[]; for(let i=0;i<400;i++){const t=i/400*4*Math.PI,a=TH0+t; helixPts.push([RR*Math.cos(a),RR*Math.sin(a),(PITCH*t/(2*Math.PI)-PITCH)*ZS]);}
    const stad=(plane)=>{const pts=[],s=LA-LB; for(let i=0;i<200;i++){const u=i/200*2*Math.PI; let a=LB*Math.cos(u), v=(Math.sin(u)>=0?s:-s)+LB*Math.sin(u); pts.push(plane==='xy'?[a,v,0]:[0,v,a]);} return pts;};
    const torusYZ=[]; for(let i=0;i<120;i++){const u=i/120*2*Math.PI; torusYZ.push([0,RJ*Math.sin(u),RJ*Math.cos(u)]);}
    const disc=[]; for(let i=-20;i<=20;i++)for(let k=-20;k<=20;k++){const x=i/20*RO,y=k/20*RO; if(x*x+y*y<=RO*RO) disc.push([x,y,0]);}

    const ringPts=[]; for(let i=0;i<10;i++){const a=i/10*2*Math.PI; for(const s of[-1,1]) ringPts.push([RR*Math.cos(a),RR*Math.sin(a),s*(PITCH/2+RW)*ZS]);}
    const linkPts=pl=>{const o=[]; for(const v of[-LA,0,LA]) for(const s of[-1,1]) o.push(pl==='xy'?[0,v,s*LR]:[s*LR,v,0]); return o;};
    const jumpPts=[]; for(let i=0;i<6;i++){const u=i/6*2*Math.PI; for(const s of[-1,1]) jumpPts.push([s*rj,RJ*Math.sin(u),RJ*Math.cos(u)]);}
    const pendPts=[]; for(let i=0;i<16;i++){const a=i/16*2*Math.PI; for(const s of[-1,1]) pendPts.push([RO*0.97*Math.cos(a),RO*0.97*Math.sin(a),s*T]);}
    for(const s of[-1,1]) pendPts.push([0,0,s*T],[0,BAIL_Y+BAIL_R,s*BAIL_r]);

    const bodies=[
      {name:'ring',    com:[0,-RR,0],     mass:3,    inertia:inertia(helixPts,3,RW*RW), pts:ringPts, radius:RR+RW},
      {name:'link1',   com:[0,y1,zMid],   mass:1.2,  inertia:inertia(stad('yz'),1.2,LR*LR), pts:linkPts('yz'), radius:LA},
      {name:'link2',   com:[0,y2,zMid],   mass:1.2,  inertia:inertia(stad('xy'),1.2,LR*LR), pts:linkPts('xy'), radius:LA},
      {name:'jump',    com:[0,yj,zMid],   mass:1,    inertia:inertia(torusYZ,1,rj*rj), pts:jumpPts, radius:RJ},
      {name:'pendant', com:[0,py,zMid],   mass:18,   inertia:inertia(disc,18,T*T/3), pts:pendPts, radius:RO},
    ];
    const anchors=[[0,0,zTop],[0,ys+RW,zMid],[0,y1-LA+LR,zMid],[0,y2-LA+LR,zMid],[0,yj-RJ+rj,zMid]];
    const X=[1,0,0], Z=[0,0,1], slop=0.2;
    const joints=[
      {a:-1,b:0, anchor:anchors[0], axA:null, axB:null},
      {a:0,b:1,  anchor:anchors[1], axA:X, axB:Z, slop},
      {a:1,b:2,  anchor:anchors[2], axA:Z, axB:X, slop},
      {a:2,b:3,  anchor:anchors[3], axA:X, axB:Z, slop},
      {a:3,b:4,  anchor:anchors[4], axA:Z, axB:X, slop},
    ];
    return { bodies, joints, dims:{RR,RW,PITCH,TH0,ZS,LA,LB,LR,RJ,rj,RO,T,BAIL_Y,BAIL_R,BAIL_r,zMid,zTop,py} };
  }

  /* build a solver world for a layout, hanging from `hand` (sim frame) with rest orientation q0 */
  function fromLayout(L, hand, q0, opts={}){
    const place=p=>add(hand,qrot(q0,p));
    const bodies=L.bodies.map(b=>({mass:b.mass,inertia:b.inertia,x:place(b.com),q:q0,pts:b.pts.map(p=>p),radius:b.radius}));
    const joints=L.joints.map(j=>{
      const comA = j.a<0 ? null : L.bodies[j.a].com, comB=L.bodies[j.b].com;

}
function disableSensors(){
  window.removeEventListener('devicemotion', onMotion);
  window.removeEventListener('deviceorientation', onOrient);
  sensorOn=false; gotOrient=false; gotMotion=false; accDev.set(0,0,0); accRaw.set(0,0,0);
  qTarget.copy(Q0); sensorsBtn.setAttribute('aria-pressed','false');
}
sensorsBtn.addEventListener('click', ()=> sensorOn ? disableSensors() : enableSensors());

/* ---------- other controls ---------- */
const rnd = mulberry32(Date.now()|0);
function shake(strength=1){
  for (const b of W.bodies){
    const k = strength*(b===W.bodies[4] ? 26 : 18);
    b.v = [b.v[0]+(rnd()-0.5)*2*k, b.v[1]+(rnd()*0.6)*k, b.v[2]+(rnd()-0.5)*1.2*k];
    b.w = [b.w[0]+(rnd()-0.5)*12*strength, b.w[1]+(rnd()-0.5)*12*strength, b.w[2]+(rnd()-0.5)*12*strength];
  }
}
document.getElementById('shake').addEventListener('click', ()=>shake(1));
const metalName = document.getElementById('metalName');
document.querySelectorAll('[data-finish]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const f = FINISHES[btn.dataset.finish];
    for (const m of metalMats){ m.color.setHex(f.color); m.roughness=f.rough; }
    metalName.textContent = f.label;
    document.querySelectorAll('[data-finish]').forEach(b=>b.setAttribute('aria-checked', String(b===btn)));
  });
});

/* ---------- loop ---------- */
const clock = new THREE.Clock();
const nBack = new THREE.Vector3(), aF = new THREE.Vector3(), qInv = new THREE.Quaternion(), ez = new THREE.Vector3(0,0,1);
let first = true;
if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) shake(0.35);

renderer.setAnimationLoop(()=>{
  const dt = Math.min(clock.getDelta(), 1/30);
  if (dt <= 0) return;

  // phone pose and screen rotation
  Qs.slerp(qTarget, 1-Math.exp(-dt*28));
  screenQ.setFromAxisAngle(ez, sensorOn ? screenAngle() : 0);
  qInv.copy(Qs).invert();
  sim.quaternion.copy(screenQ).multiply(qInv);
  sim.updateMatrixWorld(true);

  // inertial forces: gravity minus the phone's own acceleration (all in Earth axes)
  accDev.lerp(accRaw, 1-Math.exp(-dt*35));
  aF.copy(accDev).applyQuaternion(Qs).multiplyScalar(1/0.015);
  const g = [-aF.x, -aF.y, -G-aF.z];

  handF.copy(R_ATT).applyQuaternion(Qs);
  nBack.copy(ez).applyQuaternion(Qs);
  const walls = [
    { n: arr(nBack), d: BACK_Z },                        // phone back
    { n: [-nBack.x,-nBack.y,-nBack.z], d: -FRONT_Z },    // cover glass
  ];
  let grabEnv = null;
  if (grab){ grab.target = arr(sim.worldToLocal(dragWorld.clone())); grabEnv = grab; }

  W.step(dt, { g, hand: arr(handF), walls, grab: grabEnv });
  syncBodies();

  controls.update();
  renderer.render(scene, camera);
  if (first){ first=false; statusEl.hidden=true; }
});
</script>
<script>
  setTimeout(function(){
    var s=document.getElementById('status');
    if (s && !s.hidden) s.textContent='Не удалось запустить WebGL. Откройте страницу в браузере с поддержкой 3D-графики.';
  }, 9000);
</script>
